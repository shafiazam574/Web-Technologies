<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Makes the page responsive on all devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trend Categories Page</title>

    <!-- Link to external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ================= HEADER / NAVBAR ================= -->
    <header class="navbar">
        <div class="logo">LOGO</div>

        <!-- Navigation Links -->
        <nav>
            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">Courses</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>

        <!-- Search Bar -->
        <div class="search-bar">
            <input type="text" placeholder="Search here...">
        </div>
    </header>


    <!-- ================= HERO / BANNER SECTION ================= -->
    <section class="hero">
        <!-- Placeholder for large banner image -->
        <div class="hero-image">Banner Image</div>
    </section>


    <!-- ================= TREND CATEGORIES SECTION ================= -->
    <section class="trends">
        <h2>Trend Categories</h2>

        <!-- Card Container -->
        <div class="card-container">

            <!-- Single Card (repeatable structure) -->
            <div class="card">
                <div class="card-image">Image</div>
                <h3>Program / Course Goes Here</h3>
                <p>
                    Lorem ipsum dolor sit amet, consectetur adipiscing elit.
                </p>
                <button>Enroll Now</button>
            </div>

            <!-- You can duplicate the above .card for more cards -->

        </div>
    </section>


    <!-- ================= FOOTER ================= -->
    <footer class="footer">
        <p>© 2026 Your Website. All rights reserved.</p>
    </footer>

</body>
</html>
